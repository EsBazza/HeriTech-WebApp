    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5e4dc"/><stop offset="1" stop-color="#e8cfc4"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcbdb0"/><stop offset="1" stop-color="#cfac9e"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#wall)"/>
