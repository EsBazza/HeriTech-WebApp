        <ellipse cx="283" cy="395" rx="45" ry="10.5" fill="#fff" opacity="0.12"/><ellipse cx="310" cy="402" rx="90" ry="30" fill="#7d5a30"/>
        <rect x="220" y="388" width="180" height="14" fill="#a77d47"/>
        <g filter="url(#fiber)"><ellipse cx="310" cy="388" rx="90" ry="30" fill="#c29a62"/></g><ellipse cx="308.4" cy="387.6" rx="13.5" ry="4.5" fill="none" stroke="#7d5a30" stroke-opacity="0.35" stroke-width="1.2"/><ellipse cx="307.2" cy="386.8" rx="26.1" ry="8.7" fill="none" stroke="#7d5a30" stroke-opacity="0.35" stroke-width="1.2"/><ellipse cx="309.3" cy="388.3" rx="38.7" ry="12.9" fill="none" stroke="#7d5a30" stroke-opacity="0.35" stroke-width="1.2"/><ellipse cx="310.1" cy="388.4" rx="51.3" ry="17.1" fill="none" stroke="#7d5a30" stroke-opacity="0.35" stroke-width="1.2"/><ellipse cx="310.7" cy="387.3" rx="63.9" ry="21.3" fill="none" stroke="#7d5a30" stroke-opacity="0.35" stroke-width="1.2"/><ellipse cx="308.4" cy="389.4" rx="76.5" ry="25.5" fill="none" stroke="#7d5a30" stroke-opacity="0.35" stroke-width="1.2"/>
